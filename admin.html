<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Staff · RYMEC Sahaya</title>
  <meta name="theme-color" content="#0f1b3d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="admin" style="padding-bottom:24px">
  <header class="top">
    <div><h1>RYMEC Sahaya · Staff</h1><p id="collegeName"></p></div>
    <button id="logout" class="ghost" hidden>Sign out</button>
  </header>
  <div id="demoBanner" class="banner" hidden>Demo mode: this PIN is not secure. Connect Supabase for real staff accounts (see README).</div>

  <main>
    <form id="login" class="card">
      <h2>Staff sign in</h2>
      <div id="pinBox">
        <label>Demo PIN <input id="pin" type="password" inputmode="numeric" autocomplete="off"></label>
      </div>
      <div id="mailBox" hidden>
        <label>Email <input id="email" type="email" autocomplete="username"></label>
        <label>Password <input id="password" type="password" autocomplete="current-password"></label>
      </div>
      <p id="loginErr" class="error" role="alert" hidden></p>
      <button class="primary" type="submit">Sign in</button>
    </form>

    <section id="panel" hidden>
      <div class="stats" id="stats"></div>
      <div class="row filters">
        <input id="q" type="search" placeholder="Search title, details, ticket" aria-label="Search">
        <select id="fStatus" aria-label="Status"><option value="">Any status</option></select>
        <select id="fCat" aria-label="Category"><option value="">All categories</option></select>
      </div>
      <div class="row" style="margin-bottom:12px">
        <button id="refresh" class="ghost" type="button">Refresh</button>
        <button id="csv" class="ghost" type="button">Download CSV</button>
      </div>
      <div id="list" class="list"></div>
    </section>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="admin.js"></script>
</body>
</html>
